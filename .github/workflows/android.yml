name: Android CI

on:
  push:
    branches:
      - dras
    tags:
      - '*-dras.*'
  pull_request:
  workflow_dispatch:

env:
  # Bundled instead of downloaded on the phone (see AsyncAssetManager.unpackBundledRuntimes); arm64 only, other
  # devices download them as before. Java 17 runs Minecraft 1.20.1. Java 8 runs only the Forge installer: on Java 17
  # its jarsplitter writes different bytes on some phones and fails with "Processor failed, invalid outputs"
  # (https://github.com/PojavLauncherTeam/PojavLauncher/issues/3772).
  JRE17_URL: https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/download_jre17/jre17-android-arm64.tar.xz
  JRE17_SHA256: e162c860fe05ee4a4e4af7606437419879f6c748386a7b09fa77d10db6a64091
  JRE8_URL: https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/download_jre8/jre8-android-arm64.tar.xz
  JRE8_SHA256: 9a59124d9791957d55c68be664ab76831f336cf2e1e1cd4414220c6fdbf0e06d

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # The release signing config reads the keystore password from here; the keystore itself is a secret too
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
      APP_KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # versionName comes from `git describe --tags`
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle Java 17 and Java 8
        run: |
          dir=app_pojavlauncher/src/main/assets/components/bundled-jre
          mkdir -p "$dir"
          bundle() {
            curl -fsSL -o "$dir/$1" "$2"
            echo "$3  $dir/$1" | sha256sum -c
            echo "$3" > "$dir/$1.sha256"
          }
          bundle jre17-android-arm64.tar.xz "$JRE17_URL" "$JRE17_SHA256"
          bundle jre8-android-arm64.tar.xz "$JRE8_URL" "$JRE8_SHA256"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out
          # the APK names carry the version, e.g. amethyst-dras-1.1.7-dras.2.apk on a release tag
          echo "VERSION=$(git describe --tags)" >> "$GITHUB_ENV"

      - name: Test the packwiz library
        run: ./gradlew :packwiz:test

      - name: Build debug APK
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk "out/amethyst-dras-debug-$VERSION.apk"

      - name: Build release APK
        if: env.APP_KEYSTORE_B64 != ''
        run: |
          echo "$APP_KEYSTORE_B64" | base64 -d > app_pojavlauncher/aamc_upload.jks
          ./gradlew :app_pojavlauncher:assembleRelease
          rm app_pojavlauncher/aamc_upload.jks
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk "out/amethyst-dras-$VERSION.apk"

      - name: Checksums
        run: cd out && sha256sum *.apk > SHA256SUMS

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-dras
          path: out/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="amethyst-dras-$GITHUB_REF_NAME.apk"
          test -f "out/$apk" || { echo "A release needs the signing secrets"; exit 1; }
          # the release carries the signed APK only, so its checksum file lists only that
          # the fixed name keeps releases/latest/download/amethyst-dras.apk valid across releases, e.g. in a QR code
          mkdir release && cp "out/$apk" release/ && cp "out/$apk" release/amethyst-dras.apk
          (cd release && sha256sum "$apk" amethyst-dras.apk > SHA256SUMS)
          # actions/checkout leaves the tag lightweight; the changelog is the annotated tag's message
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" "release/$apk" release/amethyst-dras.apk release/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-from-tag
